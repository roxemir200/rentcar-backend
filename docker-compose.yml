# ============================================================
#  Verification locale de l'image de production
#
#  Ce fichier n'est pas un environnement de developpement : il
#  fait tourner EXACTEMENT l'image qui partira en production,
#  avec le profil "prod" et une configuration entierement
#  fournie par variables d'environnement.
#
#  C'est la reponse concrete a "comment garantissez-vous que
#  ca marche pareil en local et en production ?" — c'est la
#  meme image, seules les variables changent.
#
#  Le frontend n'est pas ici : il est deploye sur Vercel. En
#  local, `npm run dev` le fait pointer sur ce backend.
#
#  Demarrage :  docker compose up --build
# ============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: rentcar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rentcar_db}
    ports:
      # Expose sur 3307 pour ne pas entrer en conflit avec un
      # MySQL deja installe sur ta machine (port 3306).
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Le backend attend cette sonde : sans elle, il demarrerait
      # avant que MySQL accepte les connexions et echouerait.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpwd}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Rent_Car
      dockerfile: Dockerfile
    container_name: rentcar-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8089:8089"
    environment:
      # Profil de production : c'est tout l'interet de ce fichier.
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8089

      # ---------- Base de donnees ----------
      # "mysql" est le nom du service : Docker le resout sur le
      # reseau interne. useSSL=false est acceptable ici car le
      # trafic ne quitte pas le reseau du compose ; en production,
      # la base est joignable depuis Internet et SSL est requis.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rentcar_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpwd}

      # ---------- Securite ----------
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # ---------- Stripe (mode test) ----------
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # ---------- Mail ----------
      # Le compose reproduit la production : transport HTTP par defaut.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-RentCar}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # ---------- URLs ----------
      # Sans barre oblique finale : la comparaison CORS echouerait.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      # ---------- Televersement ----------
      # Par defaut "local" ici, pour pouvoir tester sans compte Cloudinary.
      # Passer a "cloudinary" reproduit exactement la production.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      APP_UPLOAD_DIR: /app/uploads

      # ---------- Supervision ----------
      # Ouvre /actuator/prometheus, que le service prometheus ci-dessous
      # vient scruter. La variable n'existe pas sur Render : l'endpoint y
      # reste ferme, et la surface publique se limite a /actuator/health.
      ACTUATOR_EXPOSURE: health,prometheus
      PROMETHEUS_ENABLED: "true"
      APP_ENV: compose
    volumes:
      # Reproduit le comportement d'un volume persistant : les
      # images survivent a un `docker compose down`. Sans volume,
      # elles disparaitraient — exactement ce qui se produirait
      # en production sans stockage externe.
      - uploads-data:/app/uploads

  # ============================================================
  #  Supervision locale — le modele PULL
  #
  #  Prometheus vient chercher les metriques du backend toutes les
  #  15 secondes, et Grafana les affiche. C'est l'architecture
  #  classique, celle qu'on attend derriere le mot « Prometheus ».
  #
  #  Elle ne peut pas etre reproduite en production : l'offre gratuite
  #  de l'hebergeur endort le service et n'offre nulle part ou loger un
  #  collecteur. La production pousse donc vers Grafana Cloud, avec la
  #  MEME instrumentation Micrometer. Deux chemins, une seule source.
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: rentcar-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Sept jours suffisent a une demonstration, et bornent la place
      # occupee sur le disque du poste.
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.5.1
    container_name: rentcar-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      # Identifiants de demonstration, sur une instance qui n'est
      # joignable que depuis ce poste. Ne jamais reproduire ailleurs.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Aucun appel sortant : la demonstration doit fonctionner meme
      # sans reseau, le jour de la soutenance.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Source de donnees et tableau de bord fournis par fichier : Grafana
      # demarre deja configure. Rien a recliquer apres un `down`, et le
      # tableau de bord est versionne comme le reste du projet.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  uploads-data:
  prometheus-data:
  grafana-data:
