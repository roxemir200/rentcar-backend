# ============================================================
#  PROFIL PROD - production
#
#  Toutes les valeurs sensibles viennent de l'environnement.
#  Volontairement, la plupart n'ont PAS de valeur par defaut :
#  il vaut mieux qu'un demarrage echoue bruyamment plutot que
#  l'application tourne avec une configuration incomplete ou
#  une cle de developpement.
#
#  Active par : SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ---------- Base de donnees ----------
# DB_URL doit etre une URL JDBC complete, par exemple :
#   jdbc:mysql://host:port/base?useSSL=true&serverTimezone=UTC
# Attention : les hebergeurs affichent souvent une URL de la forme
# mysql://user:pass@host:port/base, que Spring ne sait pas lire.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
# ddl-auto reste en "update" (herite du fichier commun) : le schema
# est cree au premier demarrage sur une base vierge. Passer a
# "validate" est possible une fois le schema stabilise.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---------- Securite ----------
# Generer avec : openssl rand -base64 48
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------- Stripe ----------
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ---------- Mail ----------
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ---------- URLs publiques ----------
# FRONTEND_URL sert aux liens envoyes par email (verification, mot de passe).
# CORS_ALLOWED_ORIGINS attend une ORIGINE, sans barre oblique finale :
#   https://mon-app.vercel.app        correct
#   https://mon-app.vercel.app/       incorrect, la comparaison echouera
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- Documentation d'API ----------
# Laissee active volontairement : elle sert a la demonstration du projet.
# A passer a false pour un deploiement destine a de vrais utilisateurs.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------- Journalisation ----------
logging.level.root=INFO
logging.level.com.rentcar=INFO
logging.level.org.hibernate.SQL=WARN
