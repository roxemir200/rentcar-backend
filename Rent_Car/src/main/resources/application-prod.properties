# ============================================================
#  PROFIL PROD - production
#
#  Toutes les valeurs sensibles viennent de l'environnement.
#  Volontairement, la plupart n'ont PAS de valeur par defaut :
#  il vaut mieux qu'un demarrage echoue bruyamment plutot que
#  l'application tourne avec une configuration incomplete ou
#  une cle de developpement.
#
#  Active par : SPRING_PROFILES_ACTIVE=prod
# ============================================================

# ---------- Base de donnees ----------
# DB_URL doit etre une URL JDBC complete, par exemple :
#   jdbc:mysql://host:port/base?useSSL=true&serverTimezone=UTC
# Attention : les hebergeurs affichent souvent une URL de la forme
# mysql://user:pass@host:port/base, que Spring ne sait pas lire.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- Pool de connexions ----------
# Hikari ouvre 10 connexions par defaut. Deux raisons de reduire :
#  - les offres gratuites de base de donnees plafonnent le nombre de
#    connexions simultanees, et le depassement produit des erreurs
#    intermittentes bien plus difficiles a diagnostiquer qu'une limite ;
#  - chaque connexion TLS ouverte au demarrage coute plusieurs secondes
#    sur une instance a 0,1 vCPU.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# Recycle les connexions avant que le serveur distant ne les ferme
# de lui-meme (wait_timeout), ce qui evite les "connection is closed".
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.idle-timeout=300000

# ---------- JPA ----------
# ddl-auto reste en "update" (herite du fichier commun) : le schema
# est cree au premier demarrage sur une base vierge. Passer a
# "validate" est possible une fois le schema stabilise.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# open-in-view reste a "true", comme en developpement.
#
# Le passer a "false" est la bonne pratique : cela evite de retenir une
# connexion pendant le rendu de la reponse. Mais la couche service de ce
# projet n'est pas prete : plusieurs methodes de lecture (dont
# CarServiceImpl.getAllCars) mappent des entites HORS transaction, en
# touchant des associations paresseuses comme Car.images et Car.reviews.
# Avec "false", le contexte de persistance est deja ferme et la lecture
# echoue en LazyInitializationException, renvoyee au client en HTTP 500.
#
# Le symptome etait invisible tant que la base restait vide : sans ligne
# a mapper, aucune association n'etait sollicitee.
#
# Bascule possible plus tard, une fois les methodes de lecture annotees
# @Transactional(readOnly = true) ou converties en jointures explicites.
spring.jpa.open-in-view=true

# ---------- Securite ----------
# Generer avec : openssl rand -base64 48
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------- Compte administrateur initial ----------
# Sans valeur par defaut, volontairement : si ces variables ne sont pas
# definies, le compte n'est pas cree. Un mot de passe par defaut ecrit
# dans le code source equivaut a publier un acces administrateur.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Stripe ----------
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ---------- Stockage des images ----------
# Cloudinary par defaut en production : le disque de l'instance est remis a
# zero a chaque deploiement, et le forfait gratuit de l'hebergeur n'offre
# pas de volume persistant.
app.storage.provider=${STORAGE_PROVIDER:cloudinary}
app.storage.cloudinary.url=${CLOUDINARY_URL:}

# ---------- Mail ----------
# En production, l'API HTTP est le defaut : Render, comme la plupart des
# hebergeurs, filtre le SMTP sortant. Le symptome est une expiration de
# delai a la connexion, jamais un refus d'authentification.
app.mail.transport=${MAIL_TRANSPORT:brevo}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from.email=${MAIL_FROM_EMAIL:}
app.mail.from.name=${MAIL_FROM_NAME:RentCar}

# Conserve pour le cas ou MAIL_TRANSPORT=smtp serait force.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ---------- URLs publiques ----------
# FRONTEND_URL sert aux liens envoyes par email (verification, mot de passe).
# CORS_ALLOWED_ORIGINS attend une ORIGINE, sans barre oblique finale :
#   https://mon-app.vercel.app        correct
#   https://mon-app.vercel.app/       incorrect, la comparaison echouera
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---------- Documentation d'API ----------
# Laissee active volontairement : elle sert a la demonstration du projet.
# A passer a false pour un deploiement destine a de vrais utilisateurs.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------- Journalisation ----------
logging.level.root=INFO
logging.level.com.rentcar=INFO
logging.level.org.hibernate.SQL=WARN
