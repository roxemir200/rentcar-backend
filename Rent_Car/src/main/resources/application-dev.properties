# ============================================================
#  PROFIL DEV - poste de developpement
#
#  Ce fichier est suivi par Git : il ne contient donc que des
#  valeurs non sensibles. Les secrets reels se placent dans
#  application-local.properties, qui est ignore par Git et
#  surcharge ce fichier (profil "local" actif apres "dev").
#
#  Les valeurs ${VAR:defaut} ci-dessous permettent a
#  l'application de demarrer meme sans application-local.properties.
# ============================================================

# ---------- Base de donnees locale ----------
spring.datasource.url=jdbc:mysql://localhost:3306/rentcar_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Journalisation SQL : utile en dev, bruyant ailleurs ----------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- URLs ----------
# Utilisees pour CORS et pour les liens envoyes par email.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------- Securite ----------
# Repli de developpement uniquement. JJWT exige au moins 32 octets
# pour signer en HS256, d'ou la longueur de cette valeur.
# En production, JWT_SECRET est obligatoire (voir application-prod.properties).
app.jwt.secret=${JWT_SECRET:dev-secret-local-uniquement-a-remplacer-0123456789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Compte administrateur initial ----------
# Valeurs de confort pour le poste de developpement, ou l'application
# n'est joignable que depuis localhost. En production, ces variables
# sont obligatoires et sans valeur par defaut.
app.admin.email=${ADMIN_EMAIL:admin@rentcar.local}
app.admin.password=${ADMIN_PASSWORD:dev-admin-local}

# ---------- Stripe (mode test) ----------
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# ---------- Mail ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ---------- Documentation d'API ----------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
