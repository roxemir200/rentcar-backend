spring.application.name=Rent_Car

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/rentcar_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA Hibernate

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# JWT Configuration
app.jwt.secret=MaCleSecreteTresLongueEtComplexePourMonProjetRentCar2026
app.jwt.expiration=86400000
# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=whsec_88cbe24347c339c4ff5b16220cf4dd918401421c7de8dfa97d36f95a5711332c

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
spring.web.resources.static-locations=classpath:/static/,file:uploads/
