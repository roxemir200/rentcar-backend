spring.application.name=Rent_Car

# ============================================================
#  CONFIGURATION COMMUNE A TOUS LES ENVIRONNEMENTS
#  Aucun secret ne doit figurer dans ce fichier : il est suivi
#  par Git. Les valeurs sensibles vivent soit dans
#  application-local.properties (dev, ignore par Git), soit
#  dans les variables d'environnement (production).
# ============================================================

# Profils :
#   dev,local -> poste de developpement (local surcharge dev)
#   prod      -> production, tout vient de l'environnement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,local}

# ---------- Serveur ----------
# Les hebergeurs conteneurises (Render, Railway, Koyeb...) imposent
# le port d'ecoute via la variable PORT et routent le trafic vers lui.
# Un port fige rend le service invisible pour la plateforme.
server.port=${PORT:8089}

# ---------- JPA / Hibernate ----------
# Le dialecte n'est pas declare : Hibernate le deduit de la connexion.
# Le forcer declenchait l'avertissement HHH90000025 et empechait toute
# adaptation automatique a la version reelle du serveur.
spring.jpa.hibernate.ddl-auto=update

# ---------- Stockage des images ----------
# "local"      : disque du serveur, adapte au poste de developpement.
# "cloudinary" : stockage externe durable, servi par CDN.
#
# Le systeme de fichiers d'un conteneur est EPHEMERE : toute image ecrite
# sur le disque disparait au redeploiement suivant. En production
# conteneurisee, "local" fait donc perdre les photos silencieusement.
app.storage.provider=${STORAGE_PROVIDER:local}

# Format : cloudinary://cle:secret@nom-du-compte
# Porte les trois informations d'authentification : c'est un secret.
app.storage.cloudinary.url=${CLOUDINARY_URL:}

# ---------- Upload de fichiers ----------
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:${app.upload.dir}/

# ---------- Actuator ----------
# Seul /actuator/health est expose. Exposer tout /actuator/**
# publierait la configuration et les variables d'environnement.
management.endpoints.web.exposure.include=health

# Le controle de sante du mail est desactive volontairement.
# Spring Boot l'ajoute des que spring-boot-starter-mail est present :
# il ouvre une connexion SMTP a chaque appel de /actuator/health.
# Deux problemes que cela cause :
#  - la sonde de l'hebergeur repond DOWN si le SMTP est injoignable,
#    alors que l'application fonctionne parfaitement ;
#  - un SMTP qui ne repond pas fait durer la sonde plusieurs minutes,
#    en monopolisant un thread Tomcat.
# "L'application est-elle vivante" et "le serveur mail repond-il"
# sont deux questions distinctes : les melanger rend la sonde inutile.
management.health.mail.enabled=false

# ---------- Transport des emails ----------
# "smtp"  : SMTP classique, adapte au poste de developpement.
# "brevo" : API HTTP de Brevo, en HTTPS sur le port 443.
# La plupart des hebergeurs bloquent les ports SMTP sortants (25, 465, 587)
# pour limiter les envois abusifs : un envoi qui marche en local expire alors
# en production, sans qu'aucune erreur de configuration soit en cause.
app.mail.transport=${MAIL_TRANSPORT:smtp}

# L'adresse d'expedition doit etre VALIDEE dans Brevo (section "Senders"),
# sinon l'API repond 400 meme avec une cle valide.
app.mail.from.email=${MAIL_FROM_EMAIL:}
app.mail.from.name=${MAIL_FROM_NAME:RentCar}
app.mail.brevo.api-key=${BREVO_API_KEY:}

# ---------- Delais du client SMTP ----------
# Sans ces valeurs, le client mail attend indefiniment quand le port
# est filtre : la requete qui declenche un envoi ne rend jamais la main.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.endpoint.health.probes.enabled=true

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------- Mail : transport commun ----------
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Service de recommandation (Python Flask + LightGBM) ----------
# Demarrer avec : cd ml_service && python app.py
# Spring bascule sur un repli content-based si le service est absent.
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}
ml.service.timeout-ms=8000
ml.service.fallback.enabled=true
