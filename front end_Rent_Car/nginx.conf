# ============================================================
#  Service des fichiers statiques du frontend RentCar.
#
#  Charge dans conf.d/ de l'image nginx non privilegiee, qui
#  ecoute sur 8080 : un processus non root ne peut pas ouvrir
#  le port 80.
# ============================================================

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Les fichiers produits par Vite portent une empreinte dans leur
    # nom (index-GaZ-jv9K.js) : leur contenu ne change jamais sous une
    # meme URL, ils peuvent donc etre caches sans limite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html, lui, ne doit jamais etre mis en cache : il reference
    # les fichiers empreintes, et un index perime pointerait vers des
    # fichiers qui n'existent plus apres un deploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Repli SPA. /payment/5 n'existe sur aucun disque : c'est le
    # routeur React qui le resout, dans le navigateur. Sans cette
    # ligne, la navigation interne fonctionne mais un F5 -- ou un lien
    # partage -- renvoie une 404. C'est l'equivalent conteneurise de
    # la regle "rewrites" de vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
