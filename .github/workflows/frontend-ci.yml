name: frontend-ci

on:
  workflow_run:
    workflows: ["backend-ci"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build-analyze-package:
    name: Build, SonarCloud and artifact
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: "front end_Rent_Car"

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "front end_Rent_Car/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # ✅ AJOUT : Configurer Java 21 pour SonarCloud
      - name: Set up Java 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ✅ AJOUT : Créer un alias sans espace
      - name: Create alias for frontend
        run: |
          ln -sf "$PWD/front end_Rent_Car" frontend
          ls -la frontend

      # ✅ MODIFICATION : SonarCloud avec Java 21
      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: "front end_Rent_Car/dist"
          if-no-files-found: error
          retention-days: 14