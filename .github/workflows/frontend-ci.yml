name: frontend-ci

on:
  workflow_run:
    workflows: ["backend-ci"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build-analyze-package:
    name: Build, SonarCloud and artifact
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: "front end_Rent_Car"

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "front end_Rent_Car/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # ✅ AJOUT : Configurer Java 21 pour SonarCloud
      - name: Set up Java 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Installer le SonarScanner CLI officiel pour exécuter l'analyse localement sur Java 21.
      - name: Install SonarScanner CLI
        working-directory: ${{ github.workspace }}
        run: |
          SCANNER_VERSION=6.2.1.4610
          curl -sSLo sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q sonar-scanner.zip
          echo "$PWD/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      # L'alias sans espace est toujours créé à la racine du workspace pour éviter les problèmes de chemin.
      - name: Create alias for frontend
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf frontend
          mkdir -p frontend
          cp -a "front end_Rent_Car/." frontend/
          ls -la frontend

      # Analyse SonarCloud via le CLI local, ce qui garantit l'exécution sur Java 21.
      - name: SonarCloud analysis
        working-directory: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          sonar-scanner
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.projectBaseDir=frontend
          -Dsonar.sources=src
          -Dsonar.exclusions=**/node_modules/**,**/dist/**

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: "front end_Rent_Car/dist"
          if-no-files-found: error
          retention-days: 14