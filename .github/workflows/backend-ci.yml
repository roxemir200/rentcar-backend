name: backend-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-analyze-package:
    name: Build, SonarCloud and artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-backend-${{ hashFiles('Rent_Car/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-backend-

      - name: Build, test and package
        run: mvn -B -ntp -f Rent_Car/pom.xml clean verify -DskipTests=false

      - name: Check JaCoCo report
        if: always()
        run: |
          echo "=== Recherche de jacoco.xml dans tout le repo ==="
          find . -name "jacoco.xml" -exec ls -la {} \;

      - name: Build, test, package and analyze
        run: >
          mvn -B -ntp -f Rent_Car/pom.xml
          clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -DskipTests=false
          -Dsonar.log.level=DEBUG
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.branch.name=global
          -Dsonar.branch.target=global
          -Dsonar.branch.long-lived=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect JaCoCo XML content
        if: always()
        run: |
          echo "=== Compteur global de couverture (racine du rapport) ==="
          grep -A 2 '<counter type="LINE"' Rent_Car/target/site/jacoco/jacoco.xml | tail -6
          echo ""
          echo "=== Exemple de sourcefile avec ses lignes ==="
          grep -B 2 -A 5 '<sourcefile name="CarServiceImpl.java"' Rent_Car/target/site/jacoco/jacoco.xml | head -20
          echo ""
          echo "=== Structure des packages dans le XML ==="
          grep -o '<package name="[^"]*"' Rent_Car/target/site/jacoco/jacoco.xml | head -10

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            Rent_Car/target/*.jar
            !Rent_Car/target/*original.jar
          if-no-files-found: error
          retention-days: 14

      # Nouvelle étape pour le rapport HTML JaCoCo
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: Rent_Car/target/site/jacoco/
          retention-days: 14