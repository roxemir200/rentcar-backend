name: backend-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-analyze-package:
    name: Build, SonarCloud and artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-backend-${{ hashFiles('Rent_Car/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-backend-

      - name: Run backend tests and package application
        run: mvn -B -ntp -f Rent_Car/pom.xml clean verify -DskipTests=false

      - name: Check JaCoCo report
        run: |
          ls -la Rent_Car/target/site/jacoco/
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('Rent_Car/target/site/jacoco/jacoco.xml').getroot()
          for counter in report.findall('counter'):
              print(f"{counter.attrib['type']}: missed={counter.attrib['missed']}, covered={counter.attrib['covered']}")
          PY

      - name: SonarCloud analysis
        run: >
          mvn -B -ntp -f Rent_Car/pom.xml
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.sources=src/main/java
          -Dsonar.tests=src/test/java
          -Dsonar.branch.name=global
          -Dsonar.branch.target=global
          -Dsonar.branch.long-lived=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            Rent_Car/target/*.jar
            !Rent_Car/target/*original.jar
          if-no-files-found: error
          retention-days: 14