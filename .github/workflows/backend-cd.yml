# ============================================================
#  Livraison continue du backend
#
#  Enchaine sur backend-ci : publication de l'image sur Docker
#  Hub, puis declenchement du deploiement Render.
#
#  Rien n'est reconstruit ni reteste ici. La CI a deja valide le
#  commit ; ce pipeline empaquette et livre, c'est tout.
# ============================================================

name: backend-cd

on:
  workflow_run:
    workflows: ["backend-ci"]
    types: [completed]
  # Permet de relivrer sans pousser de commit — utile pour
  # reprendre un deploiement interrompu, ou pour demontrer la
  # chaine sans modifier le code.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd
  # Volontairement false : on annule un build, jamais un
  # deploiement en cours. Interrompre un push d'image laisserait
  # un tag partiellement publie sur Docker Hub.
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Publish image and trigger Render
    runs-on: ubuntu-latest

    # backend-ci se declenche sur `on: push:` sans restriction, donc
    # sur toutes les branches. Le filtre est ici, et non dans la CI :
    # restreindre la CI priverait les branches de travail de leurs
    # tests, alors que c'est la qu'ils servent le plus.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'global')

    # Cloisonne les secrets de production et rend possible une
    # approbation manuelle avant livraison.
    environment: production

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rentcar-backend
      # Un workflow declenche par workflow_run ne connait pas le
      # commit d'origine via github.sha : il faut le lire dans
      # l'evenement. Le repli sert aux declenchements manuels.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Declare au niveau du job, et non de l'etape : une variable
      # definie dans le bloc `env:` d'une etape n'est pas lisible
      # par le `if:` de cette meme etape.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      # Supervision. Chacune est facultative : le pipeline reste vert et
      # ignore l'etape correspondante tant qu'elle n'est pas renseignee.
      BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}

    steps:
      # Sans `ref`, un workflow declenche par workflow_run se place
      # sur la branche par defaut du depot, pas sur le commit qui a
      # fait passer la CI. On construirait alors une image a partir
      # du mauvais code, sans le moindre signal d'erreur : tout
      # reste vert.
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Double etiquetage volontaire :
      #   latest    — ce que Render deploie
      #   <sha>     — la tracabilite, et le seul moyen de revenir en
      #               arriere. Ne livrer que `latest` laisse sans
      #               recours le jour ou une image casse la prod.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Rent_Car
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.COMMIT_SHA }}
          # Le cache GitHub Actions evite de retelecharger les
          # dependances Maven a chaque livraison.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le hook n'existe que lorsque Render est bascule en mode
      # « Deploy an existing image ». Tant que le service se
      # construit depuis Git, l'etape est ignoree plutot que de
      # faire echouer la livraison : l'image, elle, est publiee.
      # Le code de retour est interprete, et non pris en bloc.
      #
      # `curl -f` echouait sur tout code non-2xx, 409 compris. Or 409
      # signifie « un deploiement est deja en cours » : Render fait
      # deja ce qu'on lui demande, et repousser la demande n'aurait
      # aucun sens. Faire echouer la livraison pour ce motif signale
      # une panne la ou il n'y en a pas — et, a force, apprend a ne
      # plus regarder les pipelines rouges.
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          status=$(curl -sS -o /tmp/render-hook.out -w '%{http_code}' \
                   -X POST "$RENDER_DEPLOY_HOOK")
          body=$(cat /tmp/render-hook.out)

          case "$status" in
            2*)
              echo "Deploiement Render declenche (HTTP $status)."
              ;;
            409)
              echo "::warning::Render a repondu 409 : un deploiement etait deja en cours."
              echo "L'image publiee sera prise en compte par ce deploiement ou le suivant."
              echo "Si le service est suspendu, aucun deploiement ne partira : verifier Render."
              ;;
            *)
              echo "::error::Render a repondu $status."
              echo "$body"
              exit 1
              ;;
          esac

      - name: Skipped deployment notice
        if: env.RENDER_DEPLOY_HOOK == ''
        run: |
          echo "RENDER_DEPLOY_HOOK absent : image publiee, deploiement non declenche."
          echo "Attendu tant que Render se construit depuis Git (etape 4 du plan)."

      # ---------- Verification et supervision ----------

      # Livrer sans verifier que le service est revenu, c'est declarer une
      # victoire sur la foi d'un appel HTTP accepte. Le hook Render repond
      # immediatement : il accuse reception, il ne dit rien du resultat.
      #
      # L'attente est longue a dessein — le demarrage a froid de l'instance
      # gratuite a deja depasse quatre minutes.
      #
      # Ce que cette etape prouve : le service repond et se declare sain.
      # Ce qu'elle ne prouve pas : qu'il s'agit deja du nouveau build. Pour
      # cela il faudrait exposer la version, donc ouvrir /actuator/info.
      - name: Wait for the service to be healthy
        if: env.BACKEND_HEALTH_URL != '' && env.RENDER_DEPLOY_HOOK != ''
        timeout-minutes: 12
        run: |
          echo "Attente du retour du service..."
          for i in $(seq 1 60); do
            body=$(curl -sS --max-time 20 "$BACKEND_HEALTH_URL" || true)
            case "$body" in
              *'"status":"UP"'*)
                echo "Service sain apres $((i * 10)) secondes."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Le service n'a pas repondu UP dans le delai imparti."
          echo "Derniere reponse : $body"
          exit 1

      # Publie le tableau de bord versionne vers Grafana Cloud.
      #
      # C'est ce qui fait du tableau de bord du CODE plutot qu'un objet
      # construit a la souris : il se relit dans une revue, se corrige par
      # commit, et se retrouve a l'identique si la pile est recreee. Un
      # tableau de bord dessine dans l'interface n'existe qu'a un endroit,
      # et disparait avec lui.
      - name: Publish dashboard to Grafana Cloud
        if: env.GRAFANA_URL != '' && env.GRAFANA_API_TOKEN != ''
        run: |
          set -o pipefail
          dashboard=monitoring/grafana/provisioning/dashboards/rentcar-backend.json

          # `del(.id)` est indispensable : l'identifiant interne appartient a
          # l'instance qui a cree le tableau de bord. Le transmettre a une
          # autre instance provoque un refus, l'id n'y designant rien.
          payload=$(jq '{dashboard: del(.id), overwrite: true, message: "Publie par backend-cd"}' "$dashboard")

          status=$(curl -sS -o /tmp/grafana.out -w '%{http_code}' -X POST "$GRAFANA_URL/api/dashboards/db" -H "Authorization: Bearer $GRAFANA_API_TOKEN" -H "Content-Type: application/json" -d "$payload")

          if [ "$status" = "200" ]; then
            echo "Tableau de bord publie : $(jq -r '.url // "(sans url)"' /tmp/grafana.out)"
          else
            echo "::error::Grafana a refuse le tableau de bord (HTTP $status)."
            cat /tmp/grafana.out
            exit 1
          fi

      # Pose un repere date sur les graphiques.
      #
      # Sans lui, une degradation de latence reste une coincidence a prouver ;
      # avec lui, elle s'aligne visuellement sur une livraison precise, et le
      # commit fautif se lit directement sur le tableau de bord.
      - name: Annotate the deployment in Grafana
        if: env.GRAFANA_URL != '' && env.GRAFANA_API_TOKEN != ''
        run: |
          payload=$(jq -n --arg sha "$COMMIT_SHA" --arg img "$IMAGE" '{tags: ["deploiement", "backend"], text: ("Backend livre - commit " + $sha[0:7] + " - " + $img + ":latest")}')

          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$GRAFANA_URL/api/annotations" -H "Authorization: Bearer $GRAFANA_API_TOKEN" -H "Content-Type: application/json" -d "$payload")

          # Un repere manquant ne justifie pas de faire echouer une livraison
          # par ailleurs reussie : on signale, on ne bloque pas.
          if [ "$status" = "200" ]; then
            echo "Deploiement annote dans Grafana."
          else
            echo "::warning::Annotation refusee par Grafana (HTTP $status)."
          fi

      # Publie les regles d'alerte versionnees.
      #
      # Meme principe que le tableau de bord : les regles vivent dans le
      # depot, se relisent en revue et se corrigent par commit. Une alerte
      # creee a la souris n'existe qu'a un endroit et disparait avec la pile.
      #
      # Deux identifiants ne peuvent pas etre ecrits dans le fichier : celui
      # de la source de donnees et celui du dossier sont propres a chaque
      # instance Grafana. On les resout ici, puis on les substitue.
      - name: Publish alert rules to Grafana Cloud
        if: env.GRAFANA_URL != '' && env.GRAFANA_API_TOKEN != ''
        run: |
          set -o pipefail
          auth="Authorization: Bearer $GRAFANA_API_TOKEN"

          datasource=$(curl -sS -H "$auth" "$GRAFANA_URL/api/datasources" | jq -r '[.[] | select(.type == "prometheus")] | .[0].uid // empty')
          if [ -z "$datasource" ]; then
            echo "::error::Aucune source de donnees Prometheus trouvee dans Grafana."
            exit 1
          fi
          echo "Source de donnees : $datasource"

          # Le dossier est obligatoire pour une regle d'alerte. On le
          # reutilise s'il existe, sans quoi une seconde execution creerait
          # un doublon a chaque livraison.
          folder=$(curl -sS -H "$auth" "$GRAFANA_URL/api/folders" | jq -r '[.[] | select(.title == "RentCar")] | .[0].uid // empty')
          if [ -z "$folder" ]; then
            folder=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" -d '{"title":"RentCar"}' "$GRAFANA_URL/api/folders" | jq -r '.uid // empty')
            echo "Dossier RentCar cree : $folder"
          else
            echo "Dossier RentCar existant : $folder"
          fi
          if [ -z "$folder" ]; then
            echo "::error::Impossible d'obtenir le dossier RentCar."
            exit 1
          fi

          resolu=/tmp/alerts.json
          sed -e "s/__DATASOURCE_UID__/$datasource/g" -e "s/__FOLDER_UID__/$folder/g" monitoring/grafana/alerting/rentcar-alerts.json > "$resolu"

          echec=0
          for uid in $(jq -r '.rules[].uid' "$resolu"); do
            regle=$(jq -c --arg uid "$uid" '.rules[] | select(.uid == $uid)' "$resolu")

            # PUT met a jour, POST cree. On tente la mise a jour d'abord :
            # elle est idempotente, et c'est le cas courant.
            status=$(curl -sS -o /tmp/alert.out -w '%{http_code}' -X PUT "$GRAFANA_URL/api/v1/provisioning/alert-rules/$uid" -H "$auth" -H "Content-Type: application/json" -H "X-Disable-Provenance: true" -d "$regle")

            if [ "$status" = "404" ]; then
              status=$(curl -sS -o /tmp/alert.out -w '%{http_code}' -X POST "$GRAFANA_URL/api/v1/provisioning/alert-rules" -H "$auth" -H "Content-Type: application/json" -H "X-Disable-Provenance: true" -d "$regle")
            fi

            case "$status" in
              2*) echo "  regle publiee : $uid" ;;
              *)  echo "::error::Regle $uid refusee (HTTP $status)"; cat /tmp/alert.out; echo; echec=1 ;;
            esac
          done
          exit $echec

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend livre"
            echo ""
            echo "| Element | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Image | \`$IMAGE:latest\` |"
            echo "| Retour arriere | \`$IMAGE:$COMMIT_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
